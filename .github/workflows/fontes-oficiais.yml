name: Fontes oficiais (Transparencia, DATASUS, TSE, INEP)

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options:
          - descobrir        # baixa os catalogos de cada fonte
          - transparencia    # executa dados/fontes/transparencia/pedidos.csv
        default: descobrir
      fontes:
        description: "descobrir: todas | transparencia,datasus,tse,inep   ·   transparencia: nomes dos pedidos (vazio = todos)"
        required: false
        default: "todas"
  # Ao mudar os conectores, refaz a descoberta
  push:
    branches: [main]
    paths:
      - "R/conectores/**"
      - "R/fontes_descobrir.R"
      - ".github/workflows/fontes-oficiais.yml"

permissions:
  contents: write

concurrency:
  group: fontes-oficiais
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ACAO: ${{ github.event.inputs.acao || 'descobrir' }}
      FONTES: ${{ github.event.inputs.fontes || 'todas' }}
      TRANSPARENCIA_CHAVE: ${{ secrets.TRANSPARENCIA_CHAVE }}
      GITHUB_PAT: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versao mais recente

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes R
        run: |
          Rscript -e 'install.packages(c("httr2", "jsonlite", "tibble", "curl"))'

      - name: Completar cadeia de certificados (download.inep.gov.br)
        # O servidor do INEP nao envia o certificado intermediario. Baixamos o
        # intermediario indicado no proprio certificado (campo "CA Issuers") e
        # o somamos aos certificados do sistema: a verificacao continua ativa.
        run: |
          set +e
          url=$(openssl s_client -connect download.inep.gov.br:443 -servername download.inep.gov.br </dev/null 2>/dev/null \
                | openssl x509 -noout -text 2>/dev/null | grep -m1 "CA Issuers" | sed 's/.*URI://')
          echo "Intermediario: $url"
          if [ -n "$url" ] && curl -sfL "$url" -o inter.crt; then
            openssl x509 -inform DER -in inter.crt -out inter.pem 2>/dev/null || cp inter.crt inter.pem
            cat /etc/ssl/certs/ca-certificates.crt inter.pem > "$RUNNER_TEMP/ca-bundle.pem"
            echo "CURL_CA_BUNDLE=$RUNNER_TEMP/ca-bundle.pem" >> "$GITHUB_ENV"
            curl -sI --cacert "$RUNNER_TEMP/ca-bundle.pem" https://download.inep.gov.br/ | head -1
          fi
          exit 0

      - name: Executar
        run: |
          case "$ACAO" in
            descobrir)      Rscript R/fontes_descobrir.R "$FONTES" ;;
            transparencia)  F="$FONTES"; [ "$F" = "todas" ] && F=""; Rscript R/transparencia_coletar.R "$F" ;;
          esac

      - name: Separar arquivos grandes demais para o GitHub
        if: always()
        run: |
          mkdir -p grandes
          find dados -type f -size +95M -print -exec mv {} grandes/ \; || true

      - name: Guardar arquivos grandes como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arquivos-grandes
          path: grandes/
          if-no-files-found: ignore
          retention-days: 30

      - name: Salvar resultados no repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dados/fontes
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca nos dados."
          else
            git commit -m "Fontes oficiais: $ACAO ($FONTES)"
            git pull --rebase -X theirs
            git push
          fi
