name: Painel - coleta nas fontes oficiais

# Roda R/coleta_oficial.R (SIDRA, SIM, SINASC, CNES, TSE) e salva dados/oficial/
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "R/coleta_oficial.R"
      - ".github/workflows/painel-oficial.yml"

permissions:
  contents: write

concurrency:
  group: painel-oficial
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GITHUB_PAT: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes R
        run: |
          Rscript -e 'install.packages(c("tidyverse", "sidrar", "remotes", "janitor"))'
          Rscript -e 'remotes::install_github("rfsaldanha/microdatasus", upgrade = "never")'

      - name: Coletar
        run: Rscript R/coleta_oficial.R

      - name: Salvar resultados no repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          find dados/oficial -type f -size +95M -print -delete 2>/dev/null || true
          git add dados/oficial 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca nos dados."
          else
            git commit -m "Painel: coleta nas fontes oficiais"
            git pull --rebase
            git push
          fi
